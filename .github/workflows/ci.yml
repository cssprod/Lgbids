name: CI

on:
  push:
    branches: [main, 'wave2/**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (the tag is in the comment) so a moved tag cannot change CI.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # The latest 22.x: closing times depend on current time zone data.
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # A shuffled run catches tests that only pass in file order.
      - run: npx vitest run --sequence.shuffle
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run build:prototype
      - run: npm run check:bundles
      # Matching quality: prints precision and recall, fails on a pinned row or a drop below baseline.json.
      - run: npm run eval -- --check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run build:prototype
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: .e2e/report
          retention-days: 7

  # The supported floor from package.json engines. Tests that need 2026 tz data guard themselves.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm test

  # The app as a user installs it: production dependencies only.
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci && npm run build
      - name: Copy without dev dependencies
        run: |
          mkdir -p ../prod && cp -r package.json package-lock.json dist ../prod/
          cd ../prod && npm ci --omit=dev
      - name: Start and check health
        working-directory: ../prod
        env:
          PORT: '3999'
          DATA_DIR: ./data
        run: |
          node dist/server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3999/api/health && exit 0; sleep 1; done
          cat server.log; exit 1

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: docker build -t lgbids:ci .
      - name: Run until healthy
        run: |
          docker volume create lgbids-data
          docker run -d --name lgbids -e APP_PASSWORD=ci-only-password -v lgbids-data:/data lgbids:ci
          # The image checks every 60 s; ask for the first result sooner.
          for i in $(seq 1 40); do
            docker exec lgbids node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break
            sleep 2
          done
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' lgbids); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' lgbids)" = healthy ] || { docker logs lgbids; exit 1; }
      - name: Runs as a non-root user with a writable /data
        run: |
          uid=$(docker exec lgbids id -u); echo "uid $uid"; [ "$uid" != 0 ]
          docker exec lgbids test -f /data/lgbids.sqlite
      - name: Refuses to start without APP_PASSWORD
        run: |
          set +e
          out=$(docker run --rm lgbids:ci 2>&1); code=$?
          echo "$out"
          [ "$code" = 1 ] && echo "$out" | grep -q 'no APP_PASSWORD is set'
      - if: always()
        run: docker rm -f lgbids || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  # Screenshots differ between machines, so this runs in the Playwright image and never blocks.
  visual:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:prototype
      - run: npx playwright test --grep @visual --pass-with-no-tests
