name: Prototype live smoke

# On demand after each Netlify deploy (D33). Read-only: it only loads pages.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Hosted prototype URL
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=prototype
        env:
          PROTOTYPE_URL: ${{ inputs.url }}
